name: Mirror repo index

# This workflow used to overwrite README.md every night with the copy pulled
# from fabriziosalmi/repos, wiping anything written by hand, hero included.
# The copy now lands in REPOS.md and the README belongs to whoever writes it.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download repo index
        run: |
          curl -fsSL -o REPOS.md \
            https://raw.githubusercontent.com/fabriziosalmi/repos/refs/heads/main/README.md

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add REPOS.md
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "chore: update REPOS.md from fabriziosalmi/repos"
            # actions/checkout leaves the repo on a detached HEAD, so a bare
            # push has no branch to go to. It only bites on the scheduled run:
            # every push-triggered one worked and hid the bug for a week.
            # actions/checkout leaves the repo on a detached HEAD, so a bare push
          # has no branch to go to. It only bites on the scheduled run: every
          # push-triggered one worked and hid the bug.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
